spring:
  application:
    name: stock-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stock}
    username: ${DB_USER:stk_admin}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Dev shortcut: Hibernate creates the table if it is missing.
      # For prod, use reviewed migrations (for example Flyway) instead.
      ddl-auto: update
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
