services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stk_admin
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?set LOCAL_DB_PASSWORD before starting}
      POSTGRES_DB: stock
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stk_admin -d stock"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../app
    environment:
      DB_URL: jdbc:postgresql://db:5432/stock
      DB_USER: stk_admin
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:?set LOCAL_DB_PASSWORD before starting}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../web
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "8082:8080"
    depends_on:
      - api
