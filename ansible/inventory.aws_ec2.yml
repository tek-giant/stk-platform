plugin: amazon.aws.aws_ec2
regions:
  - eu-west-2
filters:
  instance-state-name: running
  tag:Name: stk-dev-web
hostnames:
  - instance-id
groups:
  web: "'stk-dev-web' == ec2_tags.Name"
compose:
  ansible_connection: '"amazon.aws.aws_ssm"'
  ansible_aws_ssm_region: '"eu-west-2"'
  ansible_aws_ssm_bucket_name: '"stk-ansible-transfer-743978812281"'
