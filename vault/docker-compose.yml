name: stk-vault

services:
  vault:
    image: hashicorp/vault:2.2.1
    container_name: stk-vault
    command: server
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./config:/vault/config:ro
      - vault_data:/vault/file

volumes:
  vault_data:
